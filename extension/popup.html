<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneStop – Card Wallet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafbff;
      color: #1a1a2e;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 18px 20px;
      text-align: center;
    }
    .header h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
    .header p { font-size: 11px; opacity: 0.85; margin-top: 4px; }

    .section {
      padding: 14px 20px;
      border-bottom: 1px solid #eee;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #667eea;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .card-list {
      max-height: 300px;
      overflow-y: auto;
    }
    .card-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .card-item:hover { background: #f0f0ff; }
    .card-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-bank { font-size: 11px; color: #888; }
    .card-reward { font-size: 11px; color: #10b981; font-weight: 600; white-space: nowrap; }

    .btn-analyze {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-analyze:hover { opacity: 0.9; }
    .btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      padding: 10px 20px;
      font-size: 12px;
      text-align: center;
      color: #666;
    }
    .status.error { color: #dc2626; }
    .status.success { color: #10b981; }

    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .saved-count {
      font-size: 11px;
      color: #667eea;
      font-weight: 600;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>💰 OneStop</h1>
    <p>Indian E-Commerce Price Intelligence</p>
  </div>

  <div class="section">
    <div class="section-title">💳 My Card Wallet</div>
    <div class="card-list" id="cardList">
      <div class="status">Loading cards from backend...</div>
    </div>
    <div class="saved-count" id="savedCount"></div>
  </div>

  <button class="btn-analyze" id="btnAnalyze">🔍 Analyze Current Tab</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
