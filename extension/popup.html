<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneStop — My cards</title>
  <style>
    :root {
      --bg: #FAF9F6;
      --surface: #FFFFFF;
      --surface-2: #F3F1EC;
      --border: #E7E4DC;
      --text: #1C1B18;
      --muted: #6B675F;
      --accent: #0F5C47;
      --accent-hover: #0B4A39;
      --accent-subtle: #E6F0EC;
      --accent-fg: #FAF9F6;
      --danger: #B4412E;
      --danger-subtle: #FAECE9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121210;
        --surface: #1A1A17;
        --surface-2: #22211E;
        --border: #2A2925;
        --text: #EDEBE4;
        --muted: #9A968C;
        --accent: #4FB08C;
        --accent-hover: #62BE9B;
        --accent-subtle: #1B2B25;
        --accent-fg: #121210;
        --danger: #DC6A56;
        --danger-subtle: #2B1A17;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .header p { font-size: 12px; color: var(--muted); }

    .section {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .saved-count {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .card-list {
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }
    .card-item:hover { background: var(--surface-2); }
    .card-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name {
      font-weight: 500;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-bank { font-size: 12px; color: var(--muted); }
    .card-reward {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      white-space: nowrap;
    }

    .actions {
      padding: 14px 18px;
      background: var(--bg);
    }
    .btn-analyze {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      background: var(--accent);
      color: var(--accent-fg);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease;
    }
    .btn-analyze:hover { background: var(--accent-hover); }
    .btn-analyze:disabled { opacity: 0.55; cursor: not-allowed; }

    .status {
      padding: 0 18px 14px;
      font-size: 12px;
      text-align: center;
      color: var(--muted);
    }
    .status.error { color: var(--danger); }
    .status.success { color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">
    <h1>OneStop</h1>
    <p>My cards</p>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">Select your cards</div>
      <div class="saved-count" id="savedCount"></div>
    </div>
    <div class="card-list" id="cardList">
      <div class="status" style="padding:12px 0;">Loading cards...</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-analyze" id="btnAnalyze">Check this page</button>
  </div>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
