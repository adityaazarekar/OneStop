services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: onestop
      POSTGRES_PASSWORD: onestop_dev
      POSTGRES_DB: onestop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onestop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: "http://localhost:8080/"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

